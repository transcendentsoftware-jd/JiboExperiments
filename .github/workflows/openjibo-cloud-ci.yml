name: openjibo-cloud-ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  host-prerequisites:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 compatibility needs an image with published interpreter builds.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Validate read-only host prerequisites without Docker or credentials
        working-directory: OpenJibo
        shell: pwsh
        run: |
          foreach ($pattern in @('test_inspect_openjibo_host.py','test_self_hosted_readiness.py','test_self_hosted_backup.py')) {
            python -B -m unittest discover -s tests -p $pattern
            if ($LASTEXITCODE -ne 0) { throw "Setup contract failed: $pattern" }
          }
          python -I -B tests/check_self_hosted_readiness.py --output "$env:RUNNER_TEMP/self-hosted-readiness" --source-revision '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Readiness packet export failed.' }
      - name: Retain synthetic self-hosted setup evidence
        uses: actions/upload-artifact@v4
        with:
          name: SelfHostedReadiness-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/self-hosted-readiness
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openjibo_tests
          POSTGRES_USER: openjibo_tests
          POSTGRES_PASSWORD: openjibo_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openjibo_tests -d openjibo_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: OpenJibo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate self-hosted deployment contract
        shell: bash
        run: bash ./scripts/cloud/test-openjibo-self-hosted-deployment-contract.sh

      - name: Validate Bash fresh environment initialization
        shell: bash
        run: bash ./scripts/cloud/test-openjibo-compose-env-init.sh

      - name: Validate PowerShell fresh environment initialization
        shell: pwsh
        run: ./scripts/cloud/Test-OpenJiboComposeEnvInit.ps1

      - name: Validate Bash image launcher
        shell: bash
        run: bash ./scripts/cloud/test-openjibo-self-hosted-image-launcher.sh

      - name: Validate PowerShell image launcher
        shell: pwsh
        run: ./scripts/cloud/Test-OpenJiboSelfHostedImageLauncher.ps1

      - name: Validate managed registry build authentication without Azure
        run: python3 -B -m unittest discover -s tests -p test_managed_acr_build_auth.py

      - name: Validate offline robot OTA envelope inspector
        run: python3 -B -m unittest discover -s scripts/bootstrap -p test_inspect_robot_ota_package.py

      - name: Validate offline standalone starter packaging
        run: python3 -B -m unittest discover -s tests -p test_prepare_openjibo_starter_bundle.py

      - name: Validate neutral public site contract
        run: python3 -B -m unittest discover -s tests -p test_public_site.py

      - name: Validate targeted published starter preparation
        run: python3 -B -m unittest discover -s tests -p test_prepare_published_starter.py

      - name: Validate explicit published starter launch
        run: python3 -B -m unittest discover -s tests -p test_launch_published_starter.py
        env:
          OPENJIBO_TEST_COMPOSE_CONFIG: "1"

      - name: Validate offline standalone starter verification
        run: python3 -B -m unittest discover -s tests -p test_verify_openjibo_starter_bundle.py

      - name: Validate starter provenance trust policy
        run: python3 -B -m unittest discover -s tests -p test_starter_provenance.py

      - name: Validate digest-scoped SBOM evidence policy
        run: python3 -B -m unittest discover -s tests -p test_runtime_sbom.py

      - name: Validate bounded runtime notice collection
        run: python3 -B -m unittest discover -s tests -p test_runtime_notices.py
      - name: Validate bounded NuGet metadata evidence
        run: python3 -B -m unittest discover -s tests -p test_runtime_nuget_metadata.py
      - name: Validate bounded NuGet archive notices
        run: |
          dotnet build scripts/cloud/nuget-content-verifier/NugetContentVerifier.csproj --nologo
          python3 -B -m unittest discover -s tests -p test_runtime_nuget_notices.py
      - name: Validate bounded FFmpeg source evidence
        run: python3 -B -m unittest discover -s tests -p test_runtime_ffmpeg_source.py
      - name: Validate nonexecuting FFmpeg configuration evidence
        run: python3 -B -m unittest discover -s tests -p test_runtime_ffmpeg_build.py
      - name: Validate nonexecuting speech model evidence
        run: python3 -B -m unittest discover -s tests -p test_runtime_model_evidence.py
      - name: Validate nonexecuting framework file comparison
        run: python3 -B -m unittest discover -s tests -p test_runtime_framework_files.py
      - name: Validate opt-in audio FFmpeg candidate
        run: python3 -B -m unittest discover -s tests -p test_ffmpeg_audio_candidate.py

      - name: Validate Docker build context privacy
        run: python3 -B -m unittest discover -s tests -p test_docker_build_context.py
        env:
          OPENJIBO_TEST_DOCKER_CONTEXT: "1"

      - name: Validate local Whisper build contract
        run: python3 -B -m unittest discover -s tests -p test_whisper_docker_build_contract.py

      - name: Validate read-only native Linux preflight
        run: python3 -B -m unittest discover -s tests -p test_preflight_native_linux_starter.py

      - name: Validate OpenJiboCloud staging PostgreSQL bootstrap contract
        shell: bash
        run: bash ./scripts/cloud/test-openjibo-cloud-staging-bootstrap-contract.sh

      - name: Restore and test
        run: dotnet test tests/Jibo.Cloud.Tests/Jibo.Cloud.Tests.csproj --logger "trx;LogFileName=runtime-access.trx" --results-directory "${{ runner.temp }}/runtime-access-results"
        env:
          OPENJIBO_TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=openjibo_tests;Username=openjibo_tests;Password=openjibo_tests
          OPENJIBO_TEST_POSTGRES_PRIVILEGED_CONNECTION_STRING: Host=localhost;Port=5432;Database=openjibo_tests;Username=openjibo_tests;Password=openjibo_tests

      - name: Retain exact runtime access sources and mandatory acceptance
        run: python3 -I -B tests/check_runtime_access.py --source-revision '${{ github.sha }}' --trx '${{ runner.temp }}/runtime-access-results/runtime-access.trx' --output '${{ runner.temp }}/runtime-access-candidate'
      - name: Retain runtime access candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: RuntimeAccessCandidate-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-access-candidate
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENJIBO_ENABLE_LOCAL_WHISPER: "false"
      COMPOSE_PROFILES: self-hosted
    defaults:
      run:
        working-directory: OpenJibo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test release smoke load driver
        run: node --test ./tests/Jibo.Cloud.JavaScript.Tests/*.test.mjs

      - name: Generate local release smoke authorization
        shell: bash
        run: |
          smoke_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$smoke_secret"
          echo "OPENJIBO_RELEASE_SMOKE_ENABLED=true" >> "$GITHUB_ENV"
          echo "OPENJIBO_RELEASE_SMOKE_SECRET=$smoke_secret" >> "$GITHUB_ENV"
          echo "OPENJIBO_RELEASE_SMOKE_MAX_CONCURRENT=6" >> "$GITHUB_ENV"

      - name: Build and start managed-compatible stack
        shell: bash
        run: bash ./scripts/cloud/invoke-openjibo-self-hosted-stack.sh --run-migration
        env:
          OPENJIBO_POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - name: Wait for health
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then
              exit 0
            fi
            sleep 3
          done

          echo "Open Jibo did not become healthy in time."
          docker compose ps
          docker compose logs --no-color --tail 200
          exit 1

      - name: Verify managed image omits local Whisper
        shell: bash
        run: docker compose exec -T api test ! -x /usr/bin/whisper.cpp/build/bin/whisper-cli

      - name: Check readiness against the running disposable stack
        run: python3 -I -B tests/check_self_hosted_readiness.py --live-origin http://127.0.0.1:8080 --output "${{ runner.temp }}/readiness-before-restart" --source-revision '${{ github.sha }}'

      - name: Run smoke checks
        shell: bash
        run: bash ./scripts/cloud/invoke-cloud-smoke.sh
        env:
          BASE_URL: http://localhost:8080

      - name: Run WebSocket release smoke
        run: node ./scripts/cloud/invoke-release-smoke.mjs
        env:
          BASE_URL: http://localhost:8080
          OPENJIBO_RELEASE_SMOKE_ALLOWED_HOST: localhost
          TEST_ROBOT_ID: open-jibo-smoke-staging

      - name: Verify same-image closed maintenance without runtime credentials
        shell: bash
        run: |
          image=$(docker compose images --quiet api)
          test -n "$image"
          python3 -I -B scripts/cloud/check-runtime-maintenance-image.py --image "$image" --source-revision '${{ github.sha }}' --output '${{ runner.temp }}/runtime-maintenance-image'
      - name: Retain closed maintenance image and exact sources
        uses: actions/upload-artifact@v4
        with:
          name: RuntimeMaintenanceImage-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-maintenance-image
          if-no-files-found: error

      - name: Verify registry removal rotation and reconnect on the actual image
        shell: bash
        run: |
          python3 -B -m unittest discover -s tests -p test_registry_acceptance.py
          docker pull postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          image=$(docker compose images --quiet api)
          python3 -I -B scripts/cloud/check-registry-acceptance-image.py --image "$image" --source-revision '${{ github.sha }}' --output '${{ runner.temp }}/registry-image-acceptance'
      - name: Retain isolated registry image acceptance
        uses: actions/upload-artifact@v4
        with:
          name: RegistryImageAcceptance-${{ github.sha }}
          path: ${{ runner.temp }}/registry-image-acceptance
          if-no-files-found: error

      - name: Repeat startup with persisted volumes
        shell: bash
        run: |
          set -euo pipefail
          previous_api=$(docker compose ps --quiet api)
          previous_postgres=$(docker compose ps --quiet postgres)
          test -n "$previous_api"
          test -n "$previous_postgres"
          docker compose down
          bash ./scripts/cloud/invoke-openjibo-self-hosted-stack.sh --skip-build
          current_api=$(docker compose ps --quiet api)
          current_postgres=$(docker compose ps --quiet postgres)
          test -n "$current_api"
          test -n "$current_postgres"
          test "$current_api" != "$previous_api"
          test "$current_postgres" != "$previous_postgres"
          printf '{"sourceRevision":"%s","previousApiContainerId":"%s","currentApiContainerId":"%s","previousPostgresContainerId":"%s","currentPostgresContainerId":"%s","volumeDeletionRequested":false}\n' "$GITHUB_SHA" "$previous_api" "$current_api" "$previous_postgres" "$current_postgres" > "$RUNNER_TEMP/runtime-restart.json"

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then
              exit 0
            fi
            sleep 3
          done

          echo "Open Jibo did not become healthy after repeat startup with persisted volumes."
          docker compose ps
          docker compose logs --no-color --tail 200
          exit 1

      - name: Check readiness after repeat startup
        run: python3 -I -B tests/check_self_hosted_readiness.py --live-origin http://127.0.0.1:8080 --output "${{ runner.temp }}/readiness-after-restart" --source-revision '${{ github.sha }}'

      - name: Retain disposable runtime readiness observations
        uses: actions/upload-artifact@v4
        with:
          name: SelfHostedRuntimeReadiness-${{ github.sha }}
          path: |
            ${{ runner.temp }}/readiness-before-restart
            ${{ runner.temp }}/readiness-after-restart
            ${{ runner.temp }}/runtime-restart.json
          if-no-files-found: error

      - name: Capture logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
