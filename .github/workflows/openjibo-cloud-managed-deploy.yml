name: openjibo-cloud-managed-deploy
run-name: OpenJibo ${{ inputs.deployment_target }} deploy @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Deploy to isolated staging or promote the tested commit to production
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      refresh_staging_from_production:
        description: Replace staging PostgreSQL data with a fresh production clone before migration
        required: true
        type: boolean
        default: true
      production_resource_group:
        description: Production resource group used only as the read-only staging clone source
        required: false
        default: ""
      bind_staging_hostnames:
        description: Bind staging.openjibo.com hostnames after their DNS records exist
        required: true
        type: boolean
        default: false
      staging_run_id:
        description: Successful staging workflow run ID required for production promotion
        required: false
        default: ""
      production_backup_confirmed:
        description: Confirm Azure PostgreSQL point-in-time recovery is healthy before production maintenance
        required: true
        type: boolean
        default: false
      production_database_binding_bootstrap_confirmed:
        description: One-time confirmation for the first production deploy that records non-secret database identity markers
        required: true
        type: boolean
        default: false
      existing_log_analytics_workspace_name:
        description: Existing Log Analytics workspace name after a resource-group subscription move
        required: false
        default: ""
      existing_container_registry_name:
        description: Existing Container Registry name after a resource-group subscription move
        required: false
        default: ""
      existing_key_vault_name:
        description: Existing Key Vault name after a resource-group subscription move
        required: false
        default: ""
      existing_storage_account_name:
        description: Existing Storage Account name after a resource-group subscription move
        required: false
        default: ""
      existing_postgres_server_name:
        description: Existing PostgreSQL server name after a resource-group subscription move
        required: false
        default: ""
      existing_speech_services_account_name:
        description: Existing Speech Services account name after a resource-group subscription move
        required: false
        default: ""
      location:
        description: Optional Azure region override
        required: false
        default: ""
      api_hostname:
        description: Production robot-facing API hostname
        required: false
        default: api.openjibo.com
      socket_hostname:
        description: Production robot-facing socket hostname
        required: false
        default: open-jibo-socket.openjibo.com
      neohub_hostname:
        description: Production robot-facing neohub hostname
        required: false
        default: neohub.openjibo.com
      enable_azure_speech:
        description: Enable Azure Speech STT
        required: false
        type: boolean
        default: true
      enable_sigv4_replay_observation:
        description: Enable observe-only legacy SigV4 replay telemetry in staging
        required: true
        type: boolean
        default: false
      azure_speech_region:
        description: Optional Azure Speech region override
        required: false
        default: ""
      staging_smoke_robot_count:
        description: Connected fake robots in the staging WebSocket smoke
        required: true
        type: choice
        options:
          - "6"
          - "10"
          - "15"
          - "20"
        default: "6"
      staging_smoke_turn_percent:
        description: Percent of connected fake robots turning simultaneously per round
        required: true
        type: choice
        options:
          - "10"
          - "25"
          - "50"
        default: "25"
      staging_smoke_turn_rounds:
        description: Concurrent-turn rounds in the staging smoke (1-1000)
        required: true
        default: "1"
      staging_smoke_round_interval_ms:
        description: Delay between staging turn rounds in milliseconds
        required: true
        default: "0"
      fleet_peer_allowed_hosts:
        description: Exact comma-separated peer hosts; a nonempty production value enables fleet peer sync
        required: false
        default: ""

concurrency:
  group: openjibo-managed-${{ inputs.deployment_target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.deployment_target == 'production' && 'openjibo-managed' || 'openjibo-staging' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: OpenJibo
    env:
      OPENJIBO_RESOURCE_GROUP: ${{ secrets.OPENJIBO_RESOURCE_GROUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve immutable image tag
        id: image
        shell: bash
        run: |
          image_tag="sha-${GITHUB_SHA:0:12}"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Validate workflow inputs
        shell: bash
        run: |
          if [[ -z "$OPENJIBO_RESOURCE_GROUP" ]]; then
            echo "The selected GitHub environment must define OPENJIBO_RESOURCE_GROUP." >&2
            exit 1
          fi

          if [[ "${{ inputs.deployment_target }}" == "staging" &&
                "${{ inputs.refresh_staging_from_production }}" == "true" &&
                -z "${{ inputs.production_resource_group }}" ]]; then
            echo "production_resource_group is required when refreshing staging." >&2
            exit 1
          fi

          if [[ "${{ inputs.deployment_target }}" == "production" &&
                -z "${{ inputs.staging_run_id }}" ]]; then
            echo "staging_run_id is required for production promotion." >&2
            exit 1
          fi

          if [[ "${{ inputs.deployment_target }}" == "production" &&
                "${{ inputs.refresh_staging_from_production }}" == "true" ]]; then
            echo "Set refresh_staging_from_production to false for production." >&2
            exit 1
          fi

          if [[ "${{ inputs.deployment_target }}" == "production" &&
                "${{ inputs.production_backup_confirmed }}" != "true" ]]; then
            echo "production_backup_confirmed must be checked for production." >&2
            exit 1
          fi

          if [[ "${{ inputs.deployment_target }}" != "production" &&
                -n "${{ inputs.fleet_peer_allowed_hosts }}" ]]; then
            echo "Fleet peer sync cannot be enabled by the staging workflow." >&2
            exit 1
          fi

          if [[ "${{ inputs.deployment_target }}" == "production" &&
                "${{ inputs.enable_sigv4_replay_observation }}" == "true" ]]; then
            echo "SigV4 replay observation is staging-only until shadow evidence is approved." >&2
            exit 1
          fi

          foundation_identity=(
            "${{ inputs.existing_log_analytics_workspace_name }}"
            "${{ inputs.existing_container_registry_name }}"
            "${{ inputs.existing_key_vault_name }}"
            "${{ inputs.existing_storage_account_name }}"
            "${{ inputs.existing_postgres_server_name }}"
            "${{ inputs.existing_speech_services_account_name }}"
          )
          specified_identity_count=0
          for resource_name in "${foundation_identity[@]}"; do
            [[ -n "$resource_name" ]] && specified_identity_count=$((specified_identity_count + 1))
          done
          if [[ "$specified_identity_count" -ne 0 && "$specified_identity_count" -ne "${#foundation_identity[@]}" ]]; then
            echo "Specify every existing foundation resource name together, or leave all of them blank." >&2
            exit 1
          fi
          if [[ "${{ inputs.deployment_target }}" == "production" &&
                "$specified_identity_count" -ne "${#foundation_identity[@]}" ]]; then
            echo "Production promotion requires all six pinned existing foundation resource names." >&2
            exit 1
          fi

      - name: Validate managed deployment contract
        shell: bash
        run: bash ./scripts/cloud/test-openjibo-managed-deployment-contract.sh

      - name: Verify exact-commit staging gate
        if: inputs.deployment_target == 'production'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          gate_directory="$(mktemp -d)"
          trap 'rm -rf -- "$gate_directory"' EXIT
          artifact_name="openjibo-staging-gate-${GITHUB_SHA}"

          gh run download "$STAGING_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "$artifact_name"             --dir "$gate_directory"

          python3 - "$gate_directory/gate.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as gate_file:
              gate = json.load(gate_file)

          expected_sha = sys.argv[2]
          if gate.get("target") != "staging":
              raise SystemExit("Promotion gate was not produced by a staging deployment.")
          if gate.get("commit") != expected_sha:
              raise SystemExit(
                  f"Staging gate commit {gate.get('commit')} does not match {expected_sha}."
              )
          if gate.get("smoke") != "passed":
              raise SystemExit("Staging gate does not record a passing smoke test.")
          if gate.get("webSocketReleaseSmoke") != "passed":
              raise SystemExit("Staging gate does not record a passing WebSocket release smoke.")
          if gate.get("replicaEvidence") != "passed" or gate.get("minimumReplicasObserved", 0) < 2:
              raise SystemExit("Staging gate does not prove two serving replicas.")
          if gate.get("crossReplicaCommittedRead") != "passed":
              raise SystemExit("Staging gate does not prove a cross-replica committed read.")
          replay_observation = gate.get("sigV4ReplayObservation")
          if replay_observation not in {"disabled", "enabled-shadow"}:
              raise SystemExit(
                  "Staging gate does not record a recognized SigV4 replay-observation state."
              )
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Azure login
        id: azure_login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing production database binding
        if: inputs.deployment_target == 'production'
        shell: bash
        run: |
          if ! app_names_json="$(az containerapp list \
            --resource-group "$OPENJIBO_RESOURCE_GROUP" \
            --query "[].name" \
            --output json)"; then
            echo "Could not enumerate the production Container App." >&2
            exit 1
          fi

          export OPENJIBO_ACTIVE_APPS_JSON="$app_names_json"
          app_count="$(python3 -c 'import json, os; print(len(json.loads(os.environ["OPENJIBO_ACTIVE_APPS_JSON"])))')"
          app_name="$(python3 -c 'import json, os; apps=json.loads(os.environ["OPENJIBO_ACTIVE_APPS_JSON"]); print(apps[0] if len(apps) == 1 else "")')"
          unset OPENJIBO_ACTIVE_APPS_JSON
          if [[ "$app_count" -ne 1 || -z "$app_name" ]]; then
            echo "Expected exactly one existing production Container App; found $app_count." >&2
            exit 1
          fi
          if [[ "$app_name" != "openjibo-cloud" ]]; then
            echo "Production Container App must be named openjibo-cloud; found '$app_name'." >&2
            exit 1
          fi

          az postgres flexible-server show \
            --resource-group "$OPENJIBO_RESOURCE_GROUP" \
            --name "${{ inputs.existing_postgres_server_name }}" \
            --query id \
            --output tsv >/dev/null

          if ! bootstrap_completed="$(az group show \
            --name "$OPENJIBO_RESOURCE_GROUP" \
            --query "tags.openjiboDatabaseBindingBootstrapCompleted" \
            --output tsv)"; then
            echo "Could not read the production database binding bootstrap marker." >&2
            exit 1
          fi

          az containerapp revision list \
            --resource-group "$OPENJIBO_RESOURCE_GROUP" \
            --name "$app_name" \
            --output json |
            python3 ./scripts/cloud/verify-openjibo-production-database-binding.py \
              "${{ inputs.existing_postgres_server_name }}" \
              openjibo_state \
              openjibo_memory \
              "${{ inputs.production_database_binding_bootstrap_confirmed }}" \
              "$bootstrap_completed"

      - name: Deploy isolated managed foundation
        id: foundation
        shell: bash
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          OPENJIBO_SEARCH_BACKEND: ${{ secrets.OPENJIBO_SEARCH_BACKEND }}
          OPENJIBO_SEARCH_FALLBACK: ${{ secrets.OPENJIBO_SEARCH_FALLBACK }}
        run: |
          deployment_output="$(mktemp)"
          extract_outputs="$(mktemp)"
          trap 'rm -f -- "$deployment_output" "$extract_outputs"' EXIT

          foundation_args=(
            --resource-group-name "$OPENJIBO_RESOURCE_GROUP"
            --open-weather-api-key "$OPENWEATHER_API_KEY"
            --news-api-key "$NEWSAPI_KEY"
            --search-backend "$OPENJIBO_SEARCH_BACKEND"
            --search-fallback "$OPENJIBO_SEARCH_FALLBACK"
          )

          if [[ -n "${{ inputs.existing_key_vault_name }}" ]]; then
            foundation_args+=(
              --log-analytics-workspace-name "${{ inputs.existing_log_analytics_workspace_name }}"
              --container-registry-name "${{ inputs.existing_container_registry_name }}"
              --key-vault-name "${{ inputs.existing_key_vault_name }}"
              --storage-account-name "${{ inputs.existing_storage_account_name }}"
              --postgres-server-name "${{ inputs.existing_postgres_server_name }}"
              --speech-services-account-name "${{ inputs.existing_speech_services_account_name }}"
            )
          fi

          bash ./scripts/cloud/deploy-openjibo-managed-foundation.sh             "${foundation_args[@]}" | tee "$deployment_output"

          cat > "$extract_outputs" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as deployment_file:
              deployment = json.load(deployment_file)

          outputs = deployment["properties"]["outputs"]
          with open(sys.argv[2], "a", encoding="utf-8") as github_output:
              for output_name in (
                  "keyVaultName",
                  "registryName",
                  "registryLoginServer",
                  "postgresServerName",
              ):
                  print(f"{output_name}={outputs[output_name]['value']}", file=github_output)
          PY
          python3 "$extract_outputs" "$deployment_output" "$GITHUB_OUTPUT"

      - name: Verify production point-in-time recovery window
        if: inputs.deployment_target == 'production'
        id: recovery
        shell: bash
        run: |
          retention_days="$(az postgres flexible-server show --resource-group "$OPENJIBO_RESOURCE_GROUP" --name "${{ steps.foundation.outputs.postgresServerName }}" --query backup.backupRetentionDays --output tsv)"
          if [[ ! "$retention_days" =~ ^[0-9]+$ || "$retention_days" -lt 7 ]]; then
            echo "PostgreSQL PITR retention must be at least seven days." >&2
            exit 1
          fi
          recovery_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "utc=$recovery_utc" >> "$GITHUB_OUTPUT"
          echo "retention_days=$retention_days" >> "$GITHUB_OUTPUT"

      - name: Verify production hostname DNS prerequisites
        if: inputs.deployment_target == 'production'
        shell: bash
        run: |
          app_name="$(az containerapp list --resource-group "$OPENJIBO_RESOURCE_GROUP" --query "[0].name" --output tsv)"
          if [[ -z "$app_name" ]]; then
            echo "The production Container App was not found for hostname validation." >&2
            exit 1
          fi

          app_json="$(az containerapp show --resource-group "$OPENJIBO_RESOURCE_GROUP" --name "$app_name" --output json)"
          verification_id="$(python3 - "$app_json" <<'PY'
          import json
          import sys

          app = json.loads(sys.argv[1])
          print(app.get("properties", {}).get("customDomainVerificationId", ""))
          PY
          )"
          app_fqdn="$(python3 - "$app_json" <<'PY'
          import json
          import sys

          app = json.loads(sys.argv[1])
          print(app.get("properties", {}).get("configuration", {}).get("ingress", {}).get("fqdn", ""))
          PY
          )"

          if [[ -z "$verification_id" || -z "$app_fqdn" ]]; then
            echo "The production Container App did not report its hostname verification ID and ingress FQDN." >&2
            exit 1
          fi
          if ! command -v dig >/dev/null 2>&1; then
            echo "The runner is missing 'dig', which is required for production DNS preflight." >&2
            exit 1
          fi

          expected_verification_id="${verification_id^^}"
          expected_fqdn="${app_fqdn%.}"
          expected_fqdn="${expected_fqdn,,}"
          hostnames=(
            "${{ inputs.api_hostname }}"
            "${{ inputs.socket_hostname }}"
            "${{ inputs.neohub_hostname }}"
            open-jibo.jibo.pro
            open-jibo-socket.jibo.pro
            api.jibo.pro
          )

          for hostname in "${hostnames[@]}"; do
            cname="$(dig +short CNAME "$hostname" | head -n 1)"
            cname="${cname%.}"
            cname="${cname,,}"
            if [[ "$cname" != "$expected_fqdn" ]]; then
              echo "${hostname} must CNAME directly to ${app_fqdn}; found '${cname:-no CNAME}'." >&2
              exit 1
            fi

            verification_match=false
            while IFS= read -r txt_value; do
              txt_value="$(printf '%s' "$txt_value" | tr -d '"')"
              txt_value="${txt_value^^}"
              if [[ "$txt_value" == "$expected_verification_id" ]]; then
                verification_match=true
                break
              fi
            done < <(dig +short TXT "asuid.${hostname}")

            if [[ "$verification_match" != "true" ]]; then
              echo "asuid.${hostname} must contain Azure verification value ${verification_id}." >&2
              exit 1
            fi
          done

          echo "Production CNAME and Azure TXT verification records are ready for all managed hostnames."

      - name: Build and push immutable managed image
        shell: bash
        run: >
          bash ./scripts/cloud/publish-openjibo-managed.sh
          --registry-name "${{ steps.foundation.outputs.registryName }}"
          --tag "${{ steps.image.outputs.tag }}"

      - name: Install PostgreSQL client for staging refresh
        if: inputs.deployment_target == 'staging' && inputs.refresh_staging_from_production
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Remove release smoke authorization before production deployment
        if: inputs.deployment_target == 'production'
        shell: bash
        run: |
          app_name="$(az containerapp list --resource-group "$OPENJIBO_RESOURCE_GROUP" --query "[0].name" --output tsv)"
          if [[ -n "$app_name" ]]; then
            bash ./scripts/cloud/cleanup-release-smoke-authorization.sh \
              --resource-group "$OPENJIBO_RESOURCE_GROUP" \
              --app-name "$app_name"
          fi

      - name: Quiesce previous target revision
        id: previous
        shell: bash
        run: |
          app_name="$(az containerapp list             --resource-group "$OPENJIBO_RESOURCE_GROUP"             --query "[0].name"             --output tsv)"

          if [[ -z "$app_name" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          revision_name="$(az containerapp show             --resource-group "$OPENJIBO_RESOURCE_GROUP"             --name "$app_name"             --query properties.latestReadyRevisionName             --output tsv)"
          revision_active=""
          if [[ -n "$revision_name" ]]; then
            revision_active="$(az containerapp revision show             --resource-group "$OPENJIBO_RESOURCE_GROUP"             --name "$app_name"             --revision "$revision_name"             --query properties.active             --output tsv)"
          fi
          image="$(az containerapp show             --resource-group "$OPENJIBO_RESOURCE_GROUP"             --name "$app_name"             --query 'properties.template.containers[0].image'             --output tsv)"
          min_replicas="$(az containerapp show             --resource-group "$OPENJIBO_RESOURCE_GROUP"             --name "$app_name"             --query 'properties.template.scale.minReplicas'             --output tsv)"
          max_replicas="$(az containerapp show             --resource-group "$OPENJIBO_RESOURCE_GROUP"             --name "$app_name"             --query 'properties.template.scale.maxReplicas'             --output tsv)"
          replay_observation_enabled="$(az containerapp show \
            --resource-group "$OPENJIBO_RESOURCE_GROUP" \
            --name "$app_name" \
            --query "properties.template.containers[0].env[?name=='OpenJibo__Security__SigV4ReplayObservation__Enabled'].value | [0]" \
            --output tsv)"

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "revision_name=$revision_name" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "min_replicas=${min_replicas:-1}" >> "$GITHUB_OUTPUT"
          echo "max_replicas=${max_replicas:-2}" >> "$GITHUB_OUTPUT"
          echo "replay_observation_enabled=${replay_observation_enabled:-false}" >> "$GITHUB_OUTPUT"

          if [[ "$revision_active" == "true" ]]; then
            az containerapp revision deactivate               --resource-group "$OPENJIBO_RESOURCE_GROUP"               --name "$app_name"               --revision "$revision_name"               --output none
          fi

      - name: Resolve production encryption Key Vault
        if: inputs.deployment_target == 'staging' && inputs.refresh_staging_from_production
        id: production_vault
        shell: bash
        run: |
          production_app_names="$(az containerapp list --resource-group "${{ inputs.production_resource_group }}" --query "[].name" --output json)"
          secret_refs="$(az containerapp secret list \
            --resource-group "${{ inputs.production_resource_group }}" \
            --name openjibo-cloud \
            --query "[?name=='user-encryption-passphrase' || name=='user-encryption-salt'].{name:name,url:keyVaultUrl}" \
            --output json)"
          managed_deployment_name="$(az deployment group list --resource-group "${{ inputs.production_resource_group }}" --query "[?starts_with(name, 'openjibo-managed-') && properties.provisioningState=='Succeeded'] | sort_by(@, &properties.timestamp) | [-1].name" --output tsv)"
          managed_app_name=""
          if [[ -n "$managed_deployment_name" ]]; then
            managed_app_name="$(az deployment group show --resource-group "${{ inputs.production_resource_group }}" --name "$managed_deployment_name" --query "properties.outputs.containerAppName.value" --output tsv)"
          fi
          foundation_deployment_name="$(az deployment group list --resource-group "${{ inputs.production_resource_group }}" --query "[?starts_with(name, 'openjibo-foundation-') && properties.provisioningState=='Succeeded'] | sort_by(@, &properties.timestamp) | [-1].name" --output tsv)"
          foundation_metadata=""
          if [[ -n "$foundation_deployment_name" ]]; then
            foundation_metadata="$(az deployment group show --resource-group "${{ inputs.production_resource_group }}" --name "$foundation_deployment_name" --query "{keyVaultName:properties.outputs.keyVaultName.value,keyVaultUri:properties.outputs.keyVaultUri.value}" --output json)"
          fi
          python3 - "$production_app_names" "$secret_refs" "$managed_app_name" "$foundation_metadata" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from urllib.parse import urlsplit, unquote

          app_names = json.loads(sys.argv[1])
          if app_names != ["openjibo-cloud"]:
              raise SystemExit("Production Container App must resolve to exactly openjibo-cloud.")
          refs = json.loads(sys.argv[2])
          expected = {"user-encryption-passphrase", "user-encryption-salt"}
          by_name = {}
          for ref in refs:
              name = ref.get("name")
              url = ref.get("url")
              if name in expected and url:
                  by_name.setdefault(name, []).append(url)
          if set(by_name) != expected or any(len(urls) != 1 for urls in by_name.values()):
              by_name = {}

          def vault_host(url, expected_secret=None):
              parts = urlsplit(url)
              host = (parts.hostname or "").lower()
              segments = [unquote(segment) for segment in parts.path.split("/") if segment]
              if parts.scheme.lower() != "https" or not host.endswith(".vault.azure.net") or not host[:-len(".vault.azure.net")]:
                  raise SystemExit("Invalid Key Vault URL metadata.")
              if expected_secret is not None and (len(segments) < 2 or segments[0].lower() != "secrets" or segments[1].lower() != expected_secret):
                  raise SystemExit(f"Invalid Key Vault URL metadata for {expected_secret}.")
              if expected_secret is None and segments:
                  raise SystemExit("Invalid Key Vault resource URI metadata.")
              return host

          vault_name = ""
          if by_name:
              parsed = {name: vault_host(urls[0], name) for name, urls in by_name.items()}
              if parsed["user-encryption-passphrase"] != parsed["user-encryption-salt"]:
                  raise SystemExit("Production encryption secrets reference different Key Vaults.")
              vault_name = parsed["user-encryption-passphrase"][:-len(".vault.azure.net")]
          else:
              if sys.argv[3] != "openjibo-cloud":
                  raise SystemExit("Latest successful managed deployment does not identify openjibo-cloud.")
              metadata = json.loads(sys.argv[4])
              if not metadata.get("keyVaultName") or not metadata.get("keyVaultUri"):
                  raise SystemExit("Latest successful foundation deployment lacks Key Vault outputs.")
              uri_host = vault_host(metadata["keyVaultUri"])
              uri_name = uri_host[:-len(".vault.azure.net")]
              if metadata["keyVaultName"].lower() != uri_name:
                  raise SystemExit("Foundation Key Vault name and URI do not match.")
              vault_name = uri_name
          if not vault_name:
              raise SystemExit("Could not derive the production Key Vault name.")
          with open(sys.argv[5], "a", encoding="utf-8") as output:
              print(f"keyVaultName={vault_name}", file=output)
          PY

      - name: Refresh staging databases from production
        if: inputs.deployment_target == 'staging' && inputs.refresh_staging_from_production
        shell: bash
        run: >
          bash ./scripts/cloud/clone-openjibo-managed-databases.sh
          --source-resource-group "${{ inputs.production_resource_group }}"
          --source-key-vault-name "${{ steps.production_vault.outputs.keyVaultName }}"
          --target-resource-group "$OPENJIBO_RESOURCE_GROUP"
          --target-key-vault-name "${{ steps.foundation.outputs.keyVaultName }}"

      - name: Generate staging release smoke authorization
        if: inputs.deployment_target == 'staging'
        shell: bash
        run: |
          smoke_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$smoke_secret"
          echo "OPENJIBO_RELEASE_SMOKE_SECRET=$smoke_secret" >> "$GITHUB_ENV"

      - name: Deploy and smoke-test managed Container App
        id: deploy
        shell: bash
        run: |
          deploy_args=(
            --resource-group-name "$OPENJIBO_RESOURCE_GROUP"
            --key-vault-name "${{ steps.foundation.outputs.keyVaultName }}"
            --registry-name "${{ steps.foundation.outputs.registryName }}"
            --image-tag "${{ steps.image.outputs.tag }}"
            --run-migration
            --run-smoke
          )

          if [[ "${{ inputs.enable_azure_speech }}" == "false" ]]; then
            deploy_args+=(--disable-azure-speech)
          elif [[ -n "${{ inputs.azure_speech_region }}" ]]; then
            deploy_args+=(--azure-speech-region "${{ inputs.azure_speech_region }}")
          fi

          if [[ -n "${{ inputs.location }}" ]]; then
            deploy_args+=(--location "${{ inputs.location }}")
          fi

          if [[ "${{ inputs.deployment_target }}" == "production" ]]; then
            deploy_args+=(
              --api-hostname "${{ inputs.api_hostname }}"
              --socket-hostname "${{ inputs.socket_hostname }}"
              --neohub-hostname "${{ inputs.neohub_hostname }}"
            )
          else
            deploy_args+=(
              --api-hostname staging-api.openjibo.com
              --socket-hostname staging-open-jibo-socket.openjibo.com
              --neohub-hostname staging-neohub.openjibo.com
              --native-compatibility-api-hostname staging-open-jibo.jibo.pro
              --native-compatibility-socket-hostname staging-open-jibo-socket.jibo.pro
              --additional-compatibility-api-hostname staging-api.jibo.pro
            )
            if [[ "${{ inputs.bind_staging_hostnames }}" != "true" ]]; then
              deploy_args+=(--skip-hostname-binding --smoke-generated-fqdn)
            fi
          fi


          if [[ -n "${{ inputs.fleet_peer_allowed_hosts }}" ]]; then
            deploy_args+=(--enable-peer-sync --peer-sync-allowed-hosts "${{ inputs.fleet_peer_allowed_hosts }}")
          else
            deploy_args+=(--disable-peer-sync)
          fi

          if [[ "${{ inputs.enable_sigv4_replay_observation }}" == "true" ]]; then
            deploy_args+=(--enable-sigv4-replay-observation)
          else
            deploy_args+=(--disable-sigv4-replay-observation)
          fi

          bash ./scripts/cloud/deploy-openjibo-managed.sh "${deploy_args[@]}"

      - name: Verify staging SigV4 replay observer configuration
        if: inputs.deployment_target == 'staging'
        shell: bash
        env:
          EXPECTED_REPLAY_OBSERVATION: ${{ inputs.enable_sigv4_replay_observation }}
        run: |
          app_name="$(az containerapp list --resource-group "$OPENJIBO_RESOURCE_GROUP" --query "[0].name" --output tsv)"
          env_json="$(az containerapp show \
            --resource-group "$OPENJIBO_RESOURCE_GROUP" \
            --name "$app_name" \
            --query 'properties.template.containers[0].env' \
            --output json)"
          python3 - "$env_json" "$EXPECTED_REPLAY_OBSERVATION" <<'PY'
          import json
          import sys

          entries = {entry.get("name"): entry for entry in json.loads(sys.argv[1])}
          expected = sys.argv[2].lower()
          enabled = entries.get("OpenJibo__Security__SigV4ReplayObservation__Enabled", {})
          if str(enabled.get("value", "")).lower() != expected:
              raise SystemExit("Staging replay-observer enabled state does not match the workflow input.")

          if expected == "true":
              required_refs = {
                  "OpenJibo__Security__SigV4ReplayObservation__ConnectionString":
                      "sigv4-replay-observer-connection-string",
                  "OpenJibo__Security__SigV4ReplayHmacKey": "sigv4-replay-hmac-key",
              }
              for name, secret_ref in required_refs.items():
                  entry = entries.get(name, {})
                  if entry.get("secretRef") != secret_ref or entry.get("value"):
                      raise SystemExit(f"Staging replay-observer secret reference is invalid for {name}.")
          PY

      - name: Record production database binding bootstrap
        if: inputs.deployment_target == 'production'
        shell: bash
        run: |
          app_name="openjibo-cloud"
          az containerapp show \
            --resource-group "$OPENJIBO_RESOURCE_GROUP" \
            --name "$app_name" \
            --query name \
            --output tsv >/dev/null

          az containerapp revision list \
            --resource-group "$OPENJIBO_RESOURCE_GROUP" \
            --name "$app_name" \
            --output json |
            python3 ./scripts/cloud/verify-openjibo-production-database-binding.py \
              "${{ steps.foundation.outputs.postgresServerName }}" \
              openjibo_state \
              openjibo_memory \
              false \
              false

          az group update \
            --name "$OPENJIBO_RESOURCE_GROUP" \
            --set tags.openjiboDatabaseBindingBootstrapCompleted=true \
            --output none

      - name: Capture staging scale before two-replica proof
        if: inputs.deployment_target == 'staging'
        id: staging_scale
        shell: bash
        run: |
          app_name="$(az containerapp list --resource-group "$OPENJIBO_RESOURCE_GROUP" --query "[0].name" --output tsv)"
          min_replicas="$(az containerapp show --resource-group "$OPENJIBO_RESOURCE_GROUP" --name "$app_name" --query properties.template.scale.minReplicas --output tsv)"
          max_replicas="$(az containerapp show --resource-group "$OPENJIBO_RESOURCE_GROUP" --name "$app_name" --query properties.template.scale.maxReplicas --output tsv)"
          echo "captured=true" >> "$GITHUB_OUTPUT"
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "min_replicas=${min_replicas:-1}" >> "$GITHUB_OUTPUT"
          echo "max_replicas=${max_replicas:-2}" >> "$GITHUB_OUTPUT"

      - name: Configure release smoke authorization
        id: release_smoke_config
        shell: bash
        run: |
          app_name="$(az containerapp list --resource-group "$OPENJIBO_RESOURCE_GROUP" --query "[0].name" --output tsv)"
          if [[ -z "$app_name" ]]; then
            echo "The managed Container App could not be resolved." >&2
            exit 1
          fi
          if [[ "${{ inputs.deployment_target }}" == "staging" ]]; then
            az containerapp secret set \
              --resource-group "$OPENJIBO_RESOURCE_GROUP" \
              --name "$app_name" \
              --secrets "release-smoke-authorization=$OPENJIBO_RELEASE_SMOKE_SECRET" \
              --output none
            az containerapp update \
              --resource-group "$OPENJIBO_RESOURCE_GROUP" \
              --name "$app_name" \
              --min-replicas 2 \
              --max-replicas 2 \
              --set-env-vars \
                "OpenJibo__ReleaseSmoke__Enabled=true" \
                "OpenJibo__ReleaseSmoke__Secret=secretref:release-smoke-authorization" \
                "OpenJibo__ReleaseSmoke__MaxConcurrentDevices=${{ inputs.staging_smoke_robot_count }}" \
              --output none

            configured_revision="$(az containerapp show \
              --resource-group "$OPENJIBO_RESOURCE_GROUP" \
              --name "$app_name" \
              --query properties.latestRevisionName \
              --output tsv)"
            if [[ -z "$configured_revision" ]]; then
              echo "The release-smoke configuration did not create a Container App revision." >&2
              exit 1
            fi
            echo "revision=$configured_revision" >> "$GITHUB_OUTPUT"

            # App-level secret changes are not loaded by an already-running replica. Restart the
            # exact revision created by the env update, then wait for that revision—not an older
            # healthy revision—to own staging traffic before presenting the authorization secret.
            az containerapp revision restart \
              --resource-group "$OPENJIBO_RESOURCE_GROUP" \
              --name "$app_name" \
              --revision "$configured_revision" \
              --output none

            configured_revision_ready=false
            for _ in $(seq 1 30); do
              latest_ready_revision="$(az containerapp show \
                --resource-group "$OPENJIBO_RESOURCE_GROUP" \
                --name "$app_name" \
                --query properties.latestReadyRevisionName \
                --output tsv)"
              revision_active="$(az containerapp revision show \
                --resource-group "$OPENJIBO_RESOURCE_GROUP" \
                --name "$app_name" \
                --revision "$configured_revision" \
                --query properties.active \
                --output tsv)"
              revision_running_state="$(az containerapp revision show \
                --resource-group "$OPENJIBO_RESOURCE_GROUP" \
                --name "$app_name" \
                --revision "$configured_revision" \
                --query properties.runningState \
                --output tsv)"
              running_replicas="$(az containerapp replica list \
                --resource-group "$OPENJIBO_RESOURCE_GROUP" \
                --name "$app_name" \
                --revision "$configured_revision" \
                --query "[?properties.runningState=='Running'] | length(@)" \
                --output tsv)"
              if [[ "$latest_ready_revision" == "$configured_revision" &&
                    "$revision_active" == "true" &&
                    ( "$revision_running_state" == "Running" ||
                      "$revision_running_state" == "RunningAtMaxScale" ) &&
                    "${running_replicas:-0}" -ge 2 ]]; then
                configured_revision_ready=true
                break
              fi
              sleep 5
            done
            if [[ "$configured_revision_ready" != "true" ]]; then
              echo "The release-smoke revision did not become active and ready." >&2
              exit 1
            fi
          else
            bash ./scripts/cloud/cleanup-release-smoke-authorization.sh \
              --resource-group "$OPENJIBO_RESOURCE_GROUP" \
              --app-name "$app_name"
          fi

      - name: Run deployed WebSocket release smoke
        if: inputs.deployment_target == 'staging'
        shell: bash
        env:
          TEST_ROBOT_ID: open-jibo-smoke-staging
          RELEASE_SMOKE_CONCURRENCY: ${{ inputs.staging_smoke_robot_count }}
          RELEASE_SMOKE_TURN_PERCENT: ${{ inputs.staging_smoke_turn_percent }}
          RELEASE_SMOKE_TURN_ROUNDS: ${{ inputs.staging_smoke_turn_rounds }}
          RELEASE_SMOKE_ROUND_INTERVAL_MS: ${{ inputs.staging_smoke_round_interval_ms }}
          RELEASE_SMOKE_MIN_REPLICAS: "2"
          RELEASE_SMOKE_EXPECTED_REVISION: ${{ steps.release_smoke_config.outputs.revision }}
        run: |
          app_name="$(az containerapp list --resource-group "$OPENJIBO_RESOURCE_GROUP" --query "[0].name" --output tsv)"
          app_fqdn="$(az containerapp show --resource-group "$OPENJIBO_RESOURCE_GROUP" --name "$app_name" --query properties.configuration.ingress.fqdn --output tsv)"
          if [[ -z "$app_fqdn" ]]; then
            echo "The staging Container App did not report an ingress FQDN." >&2
            exit 1
          fi
          OPENJIBO_RELEASE_SMOKE_ALLOWED_HOST="$app_fqdn" \
            BASE_URL="https://${app_fqdn}" \
            node ./scripts/cloud/invoke-release-smoke.mjs

      - name: Disable staging release smoke authorization
        if: always() && inputs.deployment_target == 'staging' && steps.azure_login.outcome == 'success'
        shell: bash
        run: |
          app_name="$(az containerapp list --resource-group "$OPENJIBO_RESOURCE_GROUP" --query "[0].name" --output tsv)"
          if [[ -n "$app_name" ]]; then
            bash ./scripts/cloud/cleanup-release-smoke-authorization.sh \
              --resource-group "$OPENJIBO_RESOURCE_GROUP" \
              --app-name "$app_name"
          fi

      - name: Restore staging scale after two-replica proof
        if: always() && inputs.deployment_target == 'staging' && steps.staging_scale.outputs.captured == 'true'
        shell: bash
        run: |
          az containerapp update \
            --resource-group "$OPENJIBO_RESOURCE_GROUP" \
            --name "${{ steps.staging_scale.outputs.app_name }}" \
            --min-replicas "${{ steps.staging_scale.outputs.min_replicas }}" \
            --max-replicas "${{ steps.staging_scale.outputs.max_replicas }}" \
            --output none

      - name: Restore previous image after failure
        if: failure() && steps.previous.outputs.exists == 'true'
        shell: bash
        env:
          PREVIOUS_APP: ${{ steps.previous.outputs.app_name }}
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision_name }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
          PREVIOUS_MIN_REPLICAS: ${{ steps.previous.outputs.min_replicas }}
          PREVIOUS_MAX_REPLICAS: ${{ steps.previous.outputs.max_replicas }}
          PREVIOUS_REPLAY_OBSERVATION_ENABLED: ${{ steps.previous.outputs.replay_observation_enabled }}
        run: |
          echo "Deployment failed; restoring the previous image and replay-observer state."
          az containerapp update \
            --resource-group "$OPENJIBO_RESOURCE_GROUP" \
            --name "$PREVIOUS_APP" \
            --image "$PREVIOUS_IMAGE" \
            --min-replicas "$PREVIOUS_MIN_REPLICAS" \
            --max-replicas "$PREVIOUS_MAX_REPLICAS" \
            --set-env-vars "OpenJibo__Security__SigV4ReplayObservation__Enabled=${PREVIOUS_REPLAY_OBSERVATION_ENABLED:-false}" \
            --output none
          if [[ -n "$PREVIOUS_REVISION" ]]; then
            previous_revision_active="$(az containerapp revision show               --resource-group "$OPENJIBO_RESOURCE_GROUP"               --name "$PREVIOUS_APP"               --revision "$PREVIOUS_REVISION"               --query properties.active               --output tsv)"
            if [[ "$previous_revision_active" != "true" ]]; then
              az containerapp revision activate                 --resource-group "$OPENJIBO_RESOURCE_GROUP"                 --name "$PREVIOUS_APP"                 --revision "$PREVIOUS_REVISION"                 --output none
            else
              echo "Previous revision '$PREVIOUS_REVISION' is already active."
            fi
          fi

      - name: Re-disable release smoke authorization after rollback
        if: failure() && steps.previous.outputs.exists == 'true'
        shell: bash
        run: |
          bash ./scripts/cloud/cleanup-release-smoke-authorization.sh \
            --resource-group "$OPENJIBO_RESOURCE_GROUP" \
            --app-name "${{ steps.previous.outputs.app_name }}"

      - name: Create staging promotion gate
        if: success() && inputs.deployment_target == 'staging'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/openjibo-staging-gate"
          python3 - "$RUNNER_TEMP/openjibo-staging-gate/gate.json" <<'PY'
          import json
          import os
          import sys

          gate = {
              "target": "staging",
              "commit": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "imageTag": "${{ steps.image.outputs.tag }}",
              "smoke": "passed",
              "webSocketReleaseSmoke": "passed",
              "replicaEvidence": "passed",
              "minimumReplicasObserved": 2,
              "crossReplicaCommittedRead": "passed",
              "sigV4ReplayObservation": "${{ inputs.enable_sigv4_replay_observation == true && 'enabled-shadow' || 'disabled' }}",
          }
          with open(sys.argv[1], "w", encoding="utf-8") as gate_file:
              json.dump(gate, gate_file, indent=2)
          PY

      - name: Upload staging promotion gate
        if: success() && inputs.deployment_target == 'staging'
        uses: actions/upload-artifact@v7
        with:
          name: openjibo-staging-gate-${{ github.sha }}
          path: ${{ runner.temp }}/openjibo-staging-gate/gate.json
          retention-days: 14
          if-no-files-found: error

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "### OpenJibo managed deployment"
            echo
            echo "- Target: ${{ inputs.deployment_target }}"
            echo "- Commit: $GITHUB_SHA"
            echo "- Image: ${{ steps.image.outputs.tag }}"
            echo "- Database preparation: passed"
            echo "- Smoke test: passed"
            if [[ "${{ inputs.deployment_target }}" == "staging" ]]; then
              app_name="$(az containerapp list --resource-group "$OPENJIBO_RESOURCE_GROUP" --query "[0].name" --output tsv)"
              app_fqdn="$(az containerapp show --resource-group "$OPENJIBO_RESOURCE_GROUP" --name "$app_name" --query properties.configuration.ingress.fqdn --output tsv)"
              echo "- WebSocket release smoke: passed"
              echo "- Production promotion gate: workflow run $GITHUB_RUN_ID"
              echo "- Status dashboard: https://${app_fqdn}/portal/status"
            else
              echo "- PITR reference time: ${{ steps.recovery.outputs.utc }}"
              echo "- PITR retention: ${{ steps.recovery.outputs.retention_days }} days"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
